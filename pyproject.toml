[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breast-cancer-prediction-api"
version = "2.0.0"
description = "Production-ready ML API for breast cancer prediction with monitoring, drift detection, and batch inference"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Amina Zhumatayeva", email = "aminazhumataeva6@gmail.com"}
]
maintainers = [
    {name = "Amina Zhumatayeva", email = "aminazhumataeva6@gmail.com"}
]
keywords = [
    "machine-learning",
    "fastapi",
    "cancer-prediction",
    "mlops",
    "docker",
    "mlflow"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Aminasssssss/breast-cancer-api"
Repository = "https://github.com/Aminasssssss/breast-cancer-api"
Documentation = "https://github.com/Aminasssssss/breast-cancer-api/blob/main/README.md"
Issues = "https://github.com/Aminasssssss/breast-cancer-api/issues"

[project.scripts]
train = "train:main"
api = "uvicorn src.api:app --reload"
batch = "src.batch:main"
monitor = "src.monitoring_cli:main"

[project.dependencies]
fastapi = ">=0.109.0"
uvicorn = {extras = ["standard"], version = ">=0.27.0"}
scikit-learn = ">=1.3.2"
joblib = ">=1.3.2"
numpy = ">=1.24.4"
pandas = ">=2.0.3"
mlflow = ">=2.8.1"
streamlit = ">=1.29.0"
requests = ">=2.31.0"
schedule = ">=1.2.0"
pydantic = ">=2.5.3"
pydantic-settings = ">=2.1.0"
python-dotenv = ">=1.0.0"
scipy = ">=1.11.4"
prometheus-client = ">=0.19.0"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
    "ipython>=8.18.0",
    "jupyter>=1.0.0"
]
monitoring = [
    "evidently>=0.4.0",
    "whylogs>=1.1.0"
]
benchmark = [
    "locust>=2.20.0"
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "scripts*"]

[tool.black]
line-length = 88
target-version = ['py311', 'py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | mlruns
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [".venv", "venv", "env", "build", "dist", "mlruns"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
check_untyped_defs = true
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "mlflow.*", "streamlit.*", "schedule.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=src/",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=70"
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/scripts/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:"
]
fail_under = 70
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", "docs", "scripts"]
skids = ["B101", "B311", "B324"]
severity = "medium"
confidence = "medium"

[tool.safety]
ignore_ids = ["51457", "51458"]

[tool.pre-commit-config]
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "2.0.0"
tag_format = "v$version"
bump_message = "chore(release): bump version $current_version -> $new_version"